name: Build Trade SETUU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify app.json config
        run: |
          node -e "
          const fs = require('fs');
          const pngs = fs.readdirSync('.').filter(f => f.endsWith('.png'));
          let cfg = fs.existsSync('app.json') ? JSON.parse(fs.readFileSync('app.json', 'utf8')) : { expo: { name: 'Trade SETUU', slug: 'trade-setuu' } };
          cfg.expo = cfg.expo || {};
          cfg.expo.name = cfg.expo.name || 'Trade SETUU';
          cfg.expo.slug = cfg.expo.slug || 'trade-setuu';
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.package = 'com.tradesetuu.app';
          if (cfg.expo.icon && !fs.existsSync(cfg.expo.icon)) { if (pngs[0]) cfg.expo.icon = './' + pngs[0]; else delete cfg.expo.icon; }
          if (cfg.expo.splash && cfg.expo.splash.image && !fs.existsSync(cfg.expo.splash.image)) { if (pngs[0]) cfg.expo.splash.image = './' + pngs[0]; else delete cfg.expo.splash.image; }
          if (cfg.expo.android.adaptiveIcon && cfg.expo.android.adaptiveIcon.foregroundImage && !fs.existsSync(cfg.expo.android.adaptiveIcon.foregroundImage)) { if (pngs[0]) cfg.expo.android.adaptiveIcon.foregroundImage = './' + pngs[0]; else delete cfg.expo.android.adaptiveIcon; }
          fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-SETUU-APK
          path: android/app/build/outputs/apk/release/app-re
          lease.apk
