name: Build Trade SETUU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix assets and app.json
        run: |
          node << 'EOF'
          const fs = require("fs");
          const path = require("path");
          const renames = {};
          for (const f of fs.readdirSync(".")) {
            if (/^[0-9].*\.png$/i.test(f)) {
              const next = "img_" + f;
              fs.renameSync(f, next);
              renames[f] = next;
            }
          }
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === ".git") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(js|jsx|ts|tsx|json)$/i.test(entry.name)) {
                let txt = fs.readFileSync(full, "utf8");
                let changed = false;
                for (const [oldName, newName] of Object.entries(renames)) {
                  if (txt.includes(oldName)) {
                    txt = txt.split(oldName).join(newName);
                    changed = true;
                  }
                }
                if (changed) fs.writeFileSync(full, txt);
              }
            }
          }
          walk(".");
          let cfg =utputs/apk/release/*.apk
          
