name: Build Trade SETUU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install packages
        env:
          CI: true
          npm_config_legacy_peer_deps: true
        run: |
          npm install
          npx expo install --fix

      - name: Fix image names
        run: |
          for f in [0-9]*.png; do
            [ -e "$f" ] || continue
            mv "$f" "img_$f"
            grep -rl "$f" App.js src 2>/dev/null | xargs -r sed -i "s/$f/img_$f/g"
          done

      - name: Set app config
        run: |
          cat << 'EOF' > app.json
          {
            "expo": {
              "name": "Trade SETUU",
              "slug": "trade-setuu",
              "version": "1.0.0",
              "backgroundColor": "#0B0D12",
              "icon": "./img_1795099375380.png",
              "splash": {
                "image": "./img_1795099375380.png",
                "resizeMode": "contain",
                "backgroundColor": "#0B0D12"
              },
              "android": {
                "package": "com.tradesetuu.app",
                "backgroundColor": "#0B0D12",
                "adaptiveIcon": {
                  "foregroundImage": "./img_1795099375380.png",
                  "backgroundColor": "#0B0D12"
                }
              }
            }
          }
          EOF

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Lock Native Obsidian Background (Zero White Flash)
        run: |
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ]; then
            sed -i 's/#FFFFFF/#0B0D12/gI' "$COLORS_FILE"
            sed -i 's/#ffffff/#0B0D12/gI' "$COLORS_FILE"
          fi
          STYLES_FILE="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES_FILE" ]; then
            sed -i 's/<\/style>/    <item name="android:windowBackground">#0B0D12<\/item>\n  <\/style>/' "$STYLES_FILE"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-SETUU-APK
          path: android/app/build/outputs/apk/release/*.apk
