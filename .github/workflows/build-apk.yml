name: Build Trade SETUU APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure app.json
        run: |
          node -e '
          const fs = require("fs");
          let cfg = fs.existsSync("app.json")
            ? JSON.parse(fs.readFileSync("app.json", "utf8"))
            : { expo: {} };
          cfg.expo = cfg.expo || {};
          cfg.expo.name = "Trade SETUU";
          cfg.expo.slug = "trade-setuu";
          cfg.expo.android = cfg.expo.android || {};
          cfg.expo.android.package = "com.tradesetuu.app";
          delete cfg.expo.icon;
          delete cfg.expo.splash;
          delete cfg.expo.android.adaptiveIcon;
          fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-SETUU-APK
          path: android/app/build/outputs/apk/release/*.apk
